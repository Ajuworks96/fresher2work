name: Build Flutter iOS App

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'apps/mobile_flutter/**'
      - '.github/workflows/ios_build.yml'

jobs:
  build-ios:
    name: Build iOS Runner & Release Bundle
    runs-on: macos-14

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set up Java for Android compatibility
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        working-directory: apps/mobile_flutter
        run: flutter pub get

      - name: Build Flutter iOS (Release, No Code-sign)
        working-directory: apps/mobile_flutter
        run: |
          flutter build ios --release --no-codesign

      - name: Package Payload (Runner.app)
        working-directory: apps/mobile_flutter
        run: |
          mkdir -p build/ios/iphoneos/Payload
          cp -r build/ios/iphoneos/Runner.app build/ios/iphoneos/Payload/
          cd build/ios/iphoneos
          zip -r Fresher2Work-iOS-unsigned.ipa Payload
          cd ../../..

      - name: Upload iOS IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Fresher2Work-iOS-unsigned.ipa
          path: apps/mobile_flutter/build/ios/iphoneos/Fresher2Work-iOS-unsigned.ipa
          if-no-files-found: error

